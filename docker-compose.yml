## Papercrate — single-file Docker Compose
##
## Caddy sits in front of everything and handles TLS automatically:
##   - Set DOMAIN=localhost            → plain HTTP on port 80
##   - Set DOMAIN=papercrate.example   → automatic Let's Encrypt on 443
##
## Routes:
##   /            → frontend SPA
##   /api/, /download/ → backend API  (proxied by frontend nginx)
##   /webdav/     → WebDAV server
##
## Quick start:
##   cp .env.example .env   # edit values
##   docker compose up -d

x-app-env: &app-env
  DATABASE_URL: postgres://papercrate:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/papercrate
  DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-8}
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: 3000
  WEBDAV_HOST: 0.0.0.0
  WEBDAV_PORT: 3001
  WEBDAV_PATH_PREFIX: /webdav
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  JWT_ISSUER: ${JWT_ISSUER:-papercrate}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-papercrate-clients}
  JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
  DOWNLOAD_TOKEN_AUDIENCE: ${DOWNLOAD_TOKEN_AUDIENCE:-papercrate-download}
  DOWNLOAD_TOKEN_EXPIRY_MINUTES: ${DOWNLOAD_TOKEN_EXPIRY_MINUTES:-60}
  REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-30}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
  REFRESH_COOKIE_DOMAIN: ${REFRESH_COOKIE_DOMAIN:-}
  CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-papercrate}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-documents}
  QUICKWIT_ENDPOINT: http://quickwit:7280
  QUICKWIT_INDEX: ${QUICKWIT_INDEX:-documents}
  WORKER_MAX_DOCUMENT_BYTES: ${WORKER_MAX_DOCUMENT_BYTES:-209715200}
  UPLOAD_BODY_LIMIT_BYTES: ${UPLOAD_BODY_LIMIT_BYTES:-134217728}
  PROXY_DOWNLOADS: ${PROXY_DOWNLOADS:-true}
  MIGRATIONS_DATABASE_URL: postgres://papercrate:${POSTGRES_PASSWORD}@postgres:5432/papercrate
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
  WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Papercrate}
  RUST_LOG: ${RUST_LOG:-info}

services:
  # --------------------------------------------------------------------------
  # Caddy — reverse proxy with optional automatic HTTPS
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      UPLOAD_BODY_LIMIT: ${UPLOAD_BODY_LIMIT:-128m}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s\n' \
          "$${DOMAIN} {" \
          "  handle /webdav* {" \
          "    reverse_proxy webdav:3001" \
          "  }" \
          "  handle /api/* {" \
          "    reverse_proxy backend:3000" \
          "  }" \
          "  handle /download/* {" \
          "    reverse_proxy backend:3000" \
          "  }" \
          "  handle {" \
          "    reverse_proxy frontend:80" \
          "  }" \
          "  request_body {" \
          "    max_size $${UPLOAD_BODY_LIMIT}" \
          "  }" \
          "}" > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      frontend:
        condition: service_started

  # --------------------------------------------------------------------------
  # Postgres
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: papercrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: papercrate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papercrate -d papercrate"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-papercrate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-papercrate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-documents}
    entrypoint: >
      /bin/sh -c "
        set -e;
        /usr/bin/mc alias set papercrate http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        /usr/bin/mc mb papercrate/$${S3_BUCKET} --ignore-existing;
        exit 0;
      "
    restart: "no"

  # --------------------------------------------------------------------------
  # Quickwit — full-text search
  # --------------------------------------------------------------------------
  quickwit:
    image: quickwit/quickwit:0.8.2
    command: ["run"]
    restart: unless-stopped
    environment:
      QW_ENABLE_API_AUTH: "false"
      QW_DATA_DIR: /quickwit/data
    volumes:
      - quickwit_data:/quickwit/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7280/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Backend API
  # --------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/papercrate-dms/papercrate-backend:latest-dev}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      quickwit:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Worker — document processing (OCR, thumbnails, etc.)
  # --------------------------------------------------------------------------
  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/papercrate-dms/papercrate-backend:latest-dev}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *app-env
    entrypoint: ["/usr/local/bin/papercrate-worker"]
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # WebDAV
  # --------------------------------------------------------------------------
  webdav:
    image: ${BACKEND_IMAGE:-ghcr.io/papercrate-dms/papercrate-backend:latest-dev}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *app-env
    entrypoint: ["/usr/local/bin/papercrate-webdav"]
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Frontend — nginx SPA with /api/ and /download/ reverse proxy
  # --------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/papercrate-dms/papercrate-frontend:latest-dev}
    environment:
      UPLOAD_BODY_LIMIT_BYTES: ${UPLOAD_BODY_LIMIT_BYTES:-134217728}
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Init: database migrations
  # --------------------------------------------------------------------------
  migrator:
    image: ${BACKEND_IMAGE:-ghcr.io/papercrate-dms/papercrate-backend:latest-dev}
    depends_on:
      postgres:
        condition: service_healthy
    user: root
    environment:
      <<: *app-env
    entrypoint: ["/usr/local/bin/papercrate-admin"]
    command: ["migrate-database"]
    restart: "no"

  # --------------------------------------------------------------------------
  # Init: first user bootstrap (runs once)
  # --------------------------------------------------------------------------
  bootstrap:
    image: ${BACKEND_IMAGE:-ghcr.io/papercrate-dms/papercrate-backend:latest-dev}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    environment:
      <<: *app-env
      PAPERCRATE_INITIAL_USER: ${PAPERCRATE_INITIAL_USER:-}
    entrypoint: >
      /bin/sh -c "
        if [ ! -z \"$${PAPERCRATE_INITIAL_USER}\" ]; then
          echo \"[bootstrap] Bootstrapping initial user: $${PAPERCRATE_INITIAL_USER}\";
          /usr/local/bin/papercrate-admin create-user \"$${PAPERCRATE_INITIAL_USER}\" --with-token --personal-tenant || true;
        else
          echo \"[bootstrap] No PAPERCRATE_INITIAL_USER set.\";
        fi
      "
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
  quickwit_data:
